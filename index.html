<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kasir Seblak Mercon</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: #eef2f7;
            min-height: 100vh;
            color: #333;
        }

        /* HEADER - MERAH */
        .header {
            background: linear-gradient(135deg, #d32f2f 0%, #f44336 100%);
            color: white;
            padding: 25px 20px;
            text-align: center;
            border-radius: 0 0 20px 20px;
            box-shadow: 0 4px 12px rgba(211,47,47,0.3);
        }

        .header h1 {
            font-size: 22px;
            margin-bottom: 5px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .header p {
            font-size: 13px;
            opacity: 0.9;
        }

        .header-info {
            display: flex;
            justify-content: space-between;
            padding: 10px 20px;
            background: white;
            font-size: 12px;
            color: #666;
            border-bottom: 1px solid #e0e0e0;
        }

        /* TAB NAVIGASI */
        .tab-nav {
            display: flex;
            background: white;
            border-bottom: 2px solid #e0e0e0;
            overflow-x: auto;
            position: sticky;
            top: 0;
            z-index: 50;
        }

        .tab-btn {
            flex: 1;
            padding: 14px 10px;
            border: none;
            background: white;
            font-size: 14px;
            font-weight: 600;
            color: #666;
            cursor: pointer;
            border-bottom: 3px solid transparent;
            transition: all 0.3s;
            white-space: nowrap;
        }

        .tab-btn.active {
            color: #d32f2f;
            border-bottom-color: #d32f2f;
            background: #ffebee;
        }

        .tab-btn:hover {
            background: #fff5f5;
        }

        /* CONTAINER */
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 15px;
            display: grid;
            grid-template-columns: 1fr 380px;
            gap: 15px;
        }

        /* CARD */
        .card {
            background: white;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
        }

        .card-title {
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 8px;
            color: #1e3a5f;
            border-bottom: 2px solid #e8ecf1;
            padding-bottom: 10px;
        }

        /* SEARCH */
        .search-box {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
            margin-bottom: 15px;
            outline: none;
            transition: border 0.3s;
        }

        .search-box:focus {
            border-color: #d32f2f;
        }

        /* KATEGORI CHIPS */
        .category-chips {
            display: flex;
            gap: 8px;
            margin-bottom: 15px;
            flex-wrap: wrap;
        }

        .chip {
            padding: 8px 16px;
            border: 2px solid #e0e0e0;
            border-radius: 20px;
            background: white;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
            transition: all 0.3s;
        }

        .chip.active {
            background: #d32f2f;
            color: white;
            border-color: #d32f2f;
        }

        .chip:hover {
            border-color: #d32f2f;
        }

        /* GRID MENU */
        .menu-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: 12px;
            max-height: 600px;
            overflow-y: auto;
            padding: 5px;
        }

        .menu-card {
            background: white;
            border-radius: 10px;
            overflow: hidden;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 2px 6px rgba(0,0,0,0.08);
            border: 2px solid #f0f0f0;
        }

        .menu-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 15px rgba(0,0,0,0.12);
            border-color: #d32f2f;
        }

        .menu-card:active {
            transform: scale(0.97);
        }

        .menu-img {
            width: 100%;
            height: 90px;
            overflow: hidden;
            background: linear-gradient(135deg, #ff6b6b, #ee5a24);
        }

        .menu-img img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .menu-info {
            padding: 8px 10px;
        }

        .menu-name {
            font-weight: 600;
            font-size: 12px;
            margin-bottom: 3px;
            color: #333;
            line-height: 1.3;
        }

        .menu-price {
            color: #d32f2f;
            font-weight: 700;
            font-size: 13px;
        }

        .menu-category {
            font-size: 10px;
            color: #888;
            margin-top: 2px;
        }

        /* KERANJANG */
        .cart-container {
            position: sticky;
            top: 80px;
            height: fit-content;
        }

        .cart-items {
            max-height: 300px;
            overflow-y: auto;
            margin-bottom: 15px;
        }

        .cart-empty {
            text-align: center;
            padding: 30px 20px;
            color: #999;
        }

        .cart-empty .icon {
            font-size: 40px;
            margin-bottom: 10px;
        }

        .cart-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px;
            border-bottom: 1px solid #f0f0f0;
        }

        .cart-item-img {
            width: 45px;
            height: 45px;
            border-radius: 8px;
            overflow: hidden;
            flex-shrink: 0;
            background: linear-gradient(135deg, #ff6b6b, #ee5a24);
        }

        .cart-item-img img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .cart-item-info {
            flex: 1;
            min-width: 0;
        }

        .cart-item-name {
            font-weight: 600;
            font-size: 13px;
            color: #333;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .cart-item-price {
            color: #d32f2f;
            font-weight: 700;
            font-size: 12px;
        }

        .qty-control {
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .qty-btn {
            width: 26px;
            height: 26px;
            border-radius: 50%;
            border: none;
            cursor: pointer;
            font-weight: 700;
            font-size: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .qty-btn.minus {
            background: #ffebee;
            color: #d32f2f;
        }

        .qty-btn.plus {
            background: #e8f5e9;
            color: #2e7d32;
        }

        .qty-num {
            font-weight: 700;
            min-width: 18px;
            text-align: center;
            font-size: 13px;
        }

        /* SUMMARY */
        .summary-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
            font-size: 13px;
            color: #666;
        }

        .summary-row.total {
            font-size: 18px;
            font-weight: 700;
            color: #1e3a5f;
            margin-top: 10px;
            padding-top: 10px;
            border-top: 2px dashed #ccc;
        }

        .summary-row.total .amount {
            color: #d32f2f;
        }

        .btn-bayar {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #2e7d32, #4caf50);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            margin-top: 10px;
            transition: all 0.3s;
        }

        .btn-bayar:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(46,125,50,0.4);
        }

        .btn-bayar:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
        }

        .btn-clear {
            width: 100%;
            padding: 10px;
            background: white;
            color: #d32f2f;
            border: 2px solid #d32f2f;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 8px;
        }

        /* MODAL */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.6);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .modal-overlay.show {
            display: flex;
        }

        .modal-content {
            background: white;
            border-radius: 15px;
            width: 100%;
            max-width: 400px;
            max-height: 90vh;
            overflow-y: auto;
        }

        .modal-header {
            background: #2e7d32;
            color: white;
            padding: 20px;
            text-align: center;
            border-radius: 15px 15px 0 0;
        }

        .modal-header h2 {
            font-size: 18px;
            margin-bottom: 5px;
        }

        .struk-body {
            padding: 20px;
        }

        .struk-info {
            text-align: center;
            margin-bottom: 15px;
            padding-bottom: 15px;
            border-bottom: 2px dashed #ccc;
        }

        .struk-info h3 {
            color: #d32f2f;
            margin-bottom: 5px;
        }

        .struk-info p {
            font-size: 12px;
            color: #666;
        }

        .struk-item {
            display: flex;
            justify-content: space-between;
            padding: 5px 0;
            font-size: 13px;
        }

        .struk-item .nama {
            flex: 1;
        }

        .struk-item .qty {
            width: 40px;
            text-align: center;
            color: #666;
        }

        .struk-item .harga {
            width: 80px;
            text-align: right;
            font-weight: 600;
        }

        .struk-total {
            border-top: 2px dashed #ccc;
            margin-top: 10px;
            padding-top: 10px;
            display: flex;
            justify-content: space-between;
            font-size: 18px;
            font-weight: 700;
            color: #d32f2f;
        }

        .struk-footer {
            text-align: center;
            margin-top: 15px;
            padding-top: 15px;
            border-top: 2px dashed #ccc;
            font-size: 12px;
            color: #666;
        }

        .modal-actions {
            padding: 15px 20px;
            display: flex;
            gap: 10px;
        }

        .btn-modal {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            font-size: 14px;
        }

        .btn-close {
            background: #d32f2f;
            color: white;
        }

        .btn-print {
            background: #2e7d32;
            color: white;
        }

        /* RESPONSIVE MOBILE */
        @media (max-width: 768px) {
            .container {
                grid-template-columns: 1fr;
                padding: 10px;
            }

            .header h1 {
                font-size: 18px;
            }

            .header p {
                font-size: 12px;
            }

            .menu-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 8px;
                max-height: none;
            }

            .menu-img {
                height: 75px;
            }

            .menu-name {
                font-size: 11px;
            }

            .menu-price {
                font-size: 12px;
            }

            .cart-container {
                position: relative;
                top: 0;
            }

            .tab-btn {
                font-size: 12px;
                padding: 12px 8px;
            }

            .card {
                padding: 15px;
            }

            .card-title {
                font-size: 16px;
            }
        }

        /* SCROLLBAR */
        ::-webkit-scrollbar {
            width: 6px;
        }

        ::-webkit-scrollbar-track {
            background: #f1f1f1;
        }

        ::-webkit-scrollbar-thumb {
            background: #ccc;
            border-radius: 3px;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>🌶️ SEBLAK MERCON</h1>
        <p>Aplikasi Kasir Digital - Pedasnya Nampol!</p>
    </div>

    <div class="header-info">
        <span id="tanggal">Jumat, 18 September 2026</span>
        <span>Kasir: Admin</span>
    </div>

    <div class="tab-nav">
        <button class="tab-btn active" onclick="pindahTab('menu')"> Menu</button>
        <button class="tab-btn" onclick="pindahTab('keranjang')">🛒 Keranjang <span id="tabCount">(0)</span></button>
    </div>

    <div class="container">
        <div class="menu-container" id="menuContainer">
            <div class="card">
                <div class="card-title">🍽️ Pilih Menu</div>
                
                <input type="text" class="search-box" id="searchInput" placeholder="🔍 Cari menu...">

                <div class="category-chips" id="categoryChips">
                    <button class="chip active" data-kategori="Semua">🍽️ Semua</button>
                    <button class="chip" data-kategori="Seblak">🌶️ Seblak</button>
                    <button class="chip" data-kategori="Topping"> Topping</button>
                    <button class="chip" data-kategori="Minuman">🥤 Minuman</button>
                </div>

                <div class="menu-grid" id="menuGrid"></div>
            </div>
        </div>

        <div class="cart-container" id="cartContainer">
            <div class="card">
                <div class="card-title">🛒 Pesanan <span style="background:#d32f2f;color:white;padding:2px 10px;border-radius:15px;font-size:12px;margin-left:8px;" id="cartCount">0</span></div>

                <div class="cart-items" id="cartItems">
                    <div class="cart-empty">
                        <div class="icon">🛒</div>
                        <p>Keranjang masih kosong</p>
                        <p style="font-size:11px;margin-top:5px;">Klik menu untuk menambah</p>
                    </div>
                </div>

                <div class="summary-row">
                    <span>Subtotal</span>
                    <span id="subtotal">Rp 0</span>
                </div>
                <div class="summary-row">
                    <span>Pajak (10%)</span>
                    <span id="pajak">Rp 0</span>
                </div>
                <div class="summary-row total">
                    <span>TOTAL</span>
                    <span class="amount" id="total">Rp 0</span>
                </div>

                <button class="btn-bayar" id="btnBayar" onclick="bayar()" disabled>
                    💳 BAYAR SEKARANG
                </button>
                <button class="btn-clear" onclick="clearCart()">🗑️ Kosongkan Keranjang</button>
            </div>
        </div>
    </div>

    <div class="modal-overlay" id="modalStruk">
        <div class="modal-content">
            <div class="modal-header">
                <h2>✅ Pembayaran Berhasil!</h2>
                <p>Terima kasih atas pesanan Anda</p>
            </div>
            <div class="struk-body" id="strukBody"></div>
            <div class="modal-actions">
                <button class="btn-modal btn-close" onclick="tutupModal()">Tutup</button>
                <button class="btn-modal btn-print" onclick="cetakStruk()">🖨️ Cetak</button>
            </div>
        </div>
    </div>

    <script>
        const menuData = [
            { id: 1, nama: "Seblak Original", harga: 10000, kategori: "Seblak", gambar: "seblak-original.jpg.jpg" },
            { id: 2, nama: "Seblak Makaroni", harga: 12000, kategori: "Seblak", gambar: "seblak-macaroni.jpg.jpg" },
            { id: 3, nama: "Seblak Mie", harga: 12000, kategori: "Seblak", gambar: "seblak-mie.jpg.jpg" },
            { id: 4, nama: "Seblak Ceker", harga: 15000, kategori: "Seblak", gambar: "seblak-ceker.jpg.jpg" },
            { id: 5, nama: "Seblak Tulang", harga: 18000, kategori: "Seblak", gambar: "seblak-tulang.jpg.jpg" },
            { id: 6, nama: "Seblak Seafood", harga: 20000, kategori: "Seblak", gambar: "seblak-seafood.jpg.jpg" },
            { id: 7, nama: "Seblak Komplit", harga: 22000, kategori: "Seblak", gambar: "seblak-komplit.jpg.jpg" },
            { id: 8, nama: "Topping Sosis", harga: 3000, kategori: "Topping", gambar: "topping-sosis.jpg.jpg" },
            { id: 9, nama: "Topping Bakso", harga: 3000, kategori: "Topping", gambar: "topping-bakso.jpg.jpg" },
            { id: 10, nama: "Topping Telur", harga: 3000, kategori: "Topping", gambar: "topping-telur.jpg.jpg" },
            { id: 11, nama: "Topping Keju", harga: 4000, kategori: "Topping", gambar: "topping-keju.jpg.jpg" },
            { id: 12, nama: "Topping Baso Aci", harga: 5000, kategori: "Topping", gambar: "topping-basoaci.jpg.jpg" },
            { id: 13, nama: "Es Teh Manis", harga: 5000, kategori: "Minuman", gambar: "es-teh-manis.jpg.jpg" },
            { id: 14, nama: "Es Jeruk", harga: 6000, kategori: "Minuman", gambar: "es-jeruk.jpg.jpg" },
            { id: 15, nama: "Es Teh Tawar", harga: 3000, kategori: "Minuman", gambar: "es-teh-tawar.jpg.jpg" },
            { id: 16, nama: "Air Mineral", harga: 4000, kategori: "Minuman", gambar: "air-mineral.jpg.jpg" }
        ];

        let keranjang = [];
        let kategoriAktif = 'Semua';
        let searchQuery = '';
        let tabAktif = 'menu';

        function formatRp(angka) {
            return "Rp " + angka.toLocaleString('id-ID');
        }

        function updateTanggal() {
            const now = new Date();
            const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
            document.getElementById('tanggal').textContent = now.toLocaleDateString('id-ID', options);
        }
        updateTanggal();

        function pindahTab(tab) {
            tabAktif = tab;
            const menuContainer = document.getElementById('menuContainer');
            const cartContainer = document.getElementById('cartContainer');
            const tabs = document.querySelectorAll('.tab-btn');

            if (tab === 'menu') {
                menuContainer.style.display = 'block';
                cartContainer.style.display = 'none';
                tabs[0].classList.add('active');
                tabs[1].classList.remove('active');
            } else {
                menuContainer.style.display = 'none';
                cartContainer.style.display = 'block';
                tabs[0].classList.remove('active');
                tabs[1].classList.add('active');
            }
        }

        function renderMenu() {
            const grid = document.getElementById('menuGrid');
            let filtered = menuData;

            if (kategoriAktif !== 'Semua') {
                filtered = filtered.filter(item => item.kategori === kategoriAktif);
            }

            if (searchQuery) {
                filtered = filtered.filter(item => 
                    item.nama.toLowerCase().includes(searchQuery.toLowerCase())
                );
            }

            grid.innerHTML = filtered.map(item => `
                <div class="menu-card" onclick="tambahKeranjang(${item.id})">
                    <div class="menu-img">
                        <img src="${item.gambar}" alt="${item.nama}" onerror="this.style.display='none'; this.parentElement.innerHTML='🌶️';">
                    </div>
                    <div class="menu-info">
                        <div class="menu-name">${item.nama}</div>
                        <div class="menu-category">${item.kategori}</div>
                        <div class="menu-price">${formatRp(item.harga)}</div>
                    </div>
                </div>
            `).join('');
        }

        document.querySelectorAll('.chip').forEach(chip => {
            chip.addEventListener('click', function() {
                document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
                this.classList.add('active');
                kategoriAktif = this.dataset.kategori;
                renderMenu();
            });
        });

        document.getElementById('searchInput').addEventListener('input', function() {
            searchQuery = this.value;
            renderMenu();
        });

        function tambahKeranjang(id) {
            const item = menuData.find(m => m.id === id);
            const existing = keranjang.find(k => k.id === id);

            if (existing) {
                existing.qty++;
            } else {
                keranjang.push({ ...item, qty: 1 });
            }

            renderKeranjang();
        }

        function ubahQty(id, delta) {
            const item = keranjang.find(k => k.id === id);
            if (item) {
                item.qty += delta;
                if (item.qty <= 0) {
                    keranjang = keranjang.filter(k => k.id !== id);
                }
            }
            renderKeranjang();
        }

        function clearCart() {
            if (keranjang.length === 0) return;
            if (confirm('Yakin ingin mengosongkan keranjang?')) {
                keranjang = [];
                renderKeranjang();
            }
        }

        function renderKeranjang() {
            const container = document.getElementById('cartItems');
            const countEl = document.getElementById('cartCount');
            const tabCountEl = document.getElementById('tabCount');
            const btnBayar = document.getElementById('btnBayar');

            const totalItem = keranjang.reduce((sum, item) => sum + item.qty, 0);
            countEl.textContent = totalItem;
            tabCountEl.textContent = `(${totalItem})`;

            if (keranjang.length === 0) {
                container.innerHTML = `
                    <div class="cart-empty">
                        <div class="icon">🛒</div>
                        <p>Keranjang masih kosong</p>
                        <p style="font-size:11px;margin-top:5px;">Klik menu untuk menambah</p>
                    </div>
                `;
                btnBayar.disabled = true;
            } else {
                container.innerHTML = keranjang.map(item => `
                    <div class="cart-item">
                        <div class="cart-item-img">
                            <img src="${item.gambar}" alt="${item.nama}" onerror="this.style.display='none'; this.parentElement.innerHTML='🌶️';">
                        </div>
                        <div class="cart-item-info">
                            <div class="cart-item-name">${item.nama}</div>
                            <div class="cart-item-price">${formatRp(item.harga * item.qty)}</div>
                        </div>
                        <div class="qty-control">
                            <button class="qty-btn minus" onclick="ubahQty(${item.id}, -1)">−</button>
                            <span class="qty-num">${item.qty}</span>
                            <button class="qty-btn plus" onclick="ubahQty(${item.id}, 1)">+</button>
                        </div>
                    </div>
                `).join('');
                btnBayar.disabled = false;
            }

            updateTotal();
        }

        function updateTotal() {
            const subtotal = keranjang.reduce((sum, item) => sum + (item.harga * item.qty), 0);
            const pajak = Math.round(subtotal * 0.1);
            const total = subtotal + pajak;

            document.getElementById('subtotal').textContent = formatRp(subtotal);
            document.getElementById('pajak').textContent = formatRp(pajak);
            document.getElementById('total').textContent = formatRp(total);
        }

        function bayar() {
            if (keranjang.length === 0) return;

            const subtotal = keranjang.reduce((sum, item) => sum + (item.harga * item.qty), 0);
            const pajak = Math.round(subtotal * 0.1);
            const total = subtotal + pajak;
            const noOrder = 'SM-' + Date.now().toString().slice(-6);

            const strukHTML = `
                <div class="struk-info">
                    <h3>🌶️ SEBLAK MERCON</h3>
                    <p>Jl. Pedas No. 1, Jakarta</p>
                    <p>Telp: 0812-3456-7890</p>
                    <p style="margin-top:8px;">No. Order: <strong>${noOrder}</strong></p>
                    <p>${new Date().toLocaleString('id-ID')}</p>
                </div>
                ${keranjang.map(item => `
                    <div class="struk-item">
                        <span class="nama">${item.nama}</span>
                        <span class="qty">x${item.qty}</span>
                        <span class="harga">${formatRp(item.harga * item.qty)}</span>
                    </div>
                `).join('')}
                <div class="struk-item" style="margin-top:10px;">
                    <span>Subtotal</span>
                    <span></span>
                    <span>${formatRp(subtotal)}</span>
                </div>
                <div class="struk-item">
                    <span>Pajak (10%)</span>
                    <span></span>
                    <span>${formatRp(pajak)}</span>
                </div>
                <div class="struk-total">
                    <span>TOTAL</span>
                    <span>${formatRp(total)}</span>
                </div>
                <div class="struk-footer">
                    <p>Terima kasih atas kunjungan Anda! 🙏</p>
                    <p style="margin-top:5px;">Pedasnya nampol, rasanya jos! ️</p>
                </div>
            `;

            document.getElementById('strukBody').innerHTML = strukHTML;
            document.getElementById('modalStruk').classList.add('show');
        }

        function tutupModal() {
            document.getElementById('modalStruk').classList.remove('show');
            keranjang = [];
            renderKeranjang();
        }

        function cetakStruk() {
            const strukContent = document.getElementById('strukBody').innerHTML;
            const printWindow = window.open('', '', 'width=400,height=600');
            printWindow.document.write(`
                <html>
                <head><title>Struk - Seblak Mercon</title></head>
                <body style="font-family:monospace;padding:20px;">
                    ${strukContent}
                </body>
                </html>
            `);
            printWindow.document.close();
            printWindow.print();
        }

        // Init
        if (window.innerWidth <= 768) {
            pindahTab('menu');
        }
        renderMenu();
        renderKeranjang();
    </script>
</body>
</html>
