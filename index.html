<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Seblak Mercon - Kasir</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  
  html, body {
    height: auto;
    min-height: 100vh;
    overflow-y: auto;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: #f0f2f5;
    color: #333;
  }

  /* HEADER */
  .header {
    background: linear-gradient(135deg, #d32f2f, #e53935);
    color: white;
    padding: 16px 20px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    position: sticky;
    top: 0;
    z-index: 100;
    box-shadow: 0 2px 8px rgba(0,0,0,0.15);
  }
  .header-title {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 20px;
    font-weight: 700;
  }
  .header-info {
    text-align: right;
    font-size: 13px;
    line-height: 1.4;
  }

  /* KATEGORI */
  .categories {
    display: flex;
    gap: 10px;
    padding: 14px 16px;
    background: white;
    overflow-x: auto;
    white-space: nowrap;
    -webkit-overflow-scrolling: touch;
  }
  .categories::-webkit-scrollbar { display: none; }
  .cat-btn {
    padding: 10px 22px;
    border-radius: 25px;
    border: 2px solid #e0e0e0;
    background: white;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 6px;
    flex-shrink: 0;
    transition: all 0.2s;
  }
  .cat-btn.active {
    background: #d32f2f;
    color: white;
    border-color: #d32f2f;
  }

  /* SEARCH */
  .search-wrap {
    padding: 12px 16px;
    background: white;
  }
  .search-box {
    display: flex;
    align-items: center;
    background: #f5f5f5;
    border-radius: 25px;
    padding: 10px 16px;
    gap: 10px;
    border: 1px solid #e0e0e0;
  }
  .search-box input {
    flex: 1;
    border: none;
    background: transparent;
    font-size: 14px;
    outline: none;
  }

  /* MENU GRID */
  .menu-section {
    padding: 12px 16px 120px 16px;
  }
  .menu-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
  }
  .menu-card {
    background: linear-gradient(135deg, #ff6b6b, #ee5a52);
    border-radius: 14px;
    padding: 16px;
    min-height: 110px;
    cursor: pointer;
    position: relative;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    box-shadow: 0 3px 10px rgba(238,90,82,0.3);
    transition: transform 0.15s;
    color: white;
  }
  .menu-card:active { transform: scale(0.96); }
  .menu-card .icon {
    font-size: 28px;
    position: absolute;
    top: 10px;
    left: 12px;
  }
  .menu-card .name {
    font-weight: 700;
    font-size: 14px;
    margin-top: 30px;
    line-height: 1.3;
  }
  .menu-card .price {
    font-size: 13px;
    font-weight: 600;
    margin-top: 4px;
  }

  /* KERANJANG BAR */
  .cart-bar {
    background: #2e7d32;
    color: white;
    padding: 14px 20px;
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 18px;
    font-weight: 700;
    position: sticky;
    bottom: 0;
    z-index: 90;
    box-shadow: 0 -2px 8px rgba(0,0,0,0.15);
  }
  .cart-badge {
    background: white;
    color: #2e7d32;
    border-radius: 50%;
    width: 26px;
    height: 26px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 14px;
  }

  /* CART PANEL */
  .cart-panel {
    background: white;
    padding: 20px 16px 16px;
  }
  .cart-empty {
    text-align: center;
    padding: 30px 20px;
    color: #999;
  }
  .cart-empty .icon { font-size: 60px; margin-bottom: 10px; }
  .cart-empty p { margin: 4px 0; }
  .cart-empty .sub { font-size: 13px; }

  .cart-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 10px 0;
    border-bottom: 1px solid #f0f0f0;
  }
  .cart-item-info { flex: 1; }
  .cart-item-name { font-weight: 600; font-size: 14px; }
  .cart-item-price { font-size: 12px; color: #666; }
  .qty-ctrl {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .qty-btn {
    width: 28px;
    height: 28px;
    border-radius: 50%;
    border: 1px solid #ddd;
    background: white;
    font-size: 16px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .qty-btn.del { color: #d32f2f; }
  .qty-val { min-width: 20px; text-align: center; font-weight: 600; }

  /* TOTAL */
  .total-section {
    background: white;
    padding: 16px 20px 20px;
    border-top: 1px solid #e0e0e0;
  }
  .total-row {
    display: flex;
    justify-content: space-between;
    margin: 6px 0;
    font-size: 14px;
    color: #666;
  }
  .total-divider {
    border-top: 2px dashed #ddd;
    margin: 10px 0;
  }
  .total-final {
    display: flex;
    justify-content: space-between;
    font-size: 22px;
    font-weight: 700;
    margin: 12px 0 16px;
  }
  .total-final .val { color: #d32f2f; }

  .pay-btn {
    width: 100%;
    padding: 16px;
    background: #2e7d32;
    color: white;
    border: none;
    border-radius: 12px;
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
  }
  .pay-btn:disabled {
    background: #ccc;
    cursor: not-allowed;
  }
  .pay-btn:active:not(:disabled) { transform: scale(0.98); }
</style>
</head>
<body>

<!-- HEADER -->
<div class="header">
  <div class="header-title">
    <span>️</span>
    <span>SEBLAK MERCON</span>
  </div>
  <div class="header-info">
    <div id="tanggal">Jumat, 18 September 2026</div>
    <div>Kasir: Admin</div>
  </div>
</div>

<!-- KATEGORI -->
<div class="categories">
  <button class="cat-btn active" data-cat="semua">️ Semua</button>
  <button class="cat-btn" data-cat="seblak">️ Seblak</button>
  <button class="cat-btn" data-cat="topping">Topping</button>
  <button class="cat-btn" data-cat="minuman">Minuman</button>
</div>

<!-- SEARCH -->
<div class="search-wrap">
  <div class="search-box">
    <span>🔍</span>
    <input type="text" id="searchInput" placeholder="Cari menu...">
  </div>
</div>

<!-- MENU -->
<div class="menu-section">
  <div class="menu-grid" id="menuGrid"></div>
</div>

<!-- CART BAR -->
<div class="cart-bar">
  <span>🛒</span>
  <span>Pesanan</span>
  <span class="cart-badge" id="cartCount">0</span>
</div>

<!-- CART PANEL -->
<div class="cart-panel" id="cartPanel">
  <div class="cart-empty" id="cartEmpty">
    <div class="icon"></div>
    <p>Keranjang masih kosong</p>
    <p class="sub">Klik menu untuk menambah</p>
  </div>
  <div id="cartItems"></div>
</div>

<!-- TOTAL -->
<div class="total-section">
  <div class="total-row">
    <span>Subtotal</span>
    <span id="subtotal">Rp 0</span>
  </div>
  <div class="total-row">
    <span>Pajak (10%)</span>
    <span id="tax">Rp 0</span>
  </div>
  <div class="total-divider"></div>
  <div class="total-final">
    <span>TOTAL</span>
    <span class="val" id="total">Rp 0</span>
  </div>
  <button class="pay-btn" id="payBtn" disabled>
    <span>💳</span>
    <span>BAYAR SEKARANG</span>
  </button>
</div>

<script>
const menuData = [
  { id: 1, name: "Seblak Original", price: 12000, cat: "seblak" },
  { id: 2, name: "Seblak Bakso", price: 15000, cat: "seblak" },
  { id: 3, name: "Seblak Seafood", price: 18000, cat: "seblak" },
  { id: 4, name: "Seblak Komplit", price: 20000, cat: "seblak" },
  { id: 5, name: "Seblak Ceker", price: 17000, cat: "seblak" },
  { id: 6, name: "Seblak Mie", price: 14000, cat: "seblak" },
  { id: 7, name: "Telur", price: 3000, cat: "topping" },
  { id: 8, name: "Bakso", price: 5000, cat: "topping" },
  { id: 9, name: "Sosis", price: 4000, cat: "topping" },
  { id: 10, name: "Ceker", price: 6000, cat: "topping" },
  { id: 11, name: "Makaroni", price: 3000, cat: "topping" },
  { id: 12, name: "Es Teh", price: 5000, cat: "minuman" },
  { id: 13, name: "Es Jeruk", price: 7000, cat: "minuman" },
  { id: 14, name: "Air Mineral", price: 4000, cat: "minuman" },
];

let cart = {};
let currentCat = "semua";

const rupiah = n => "Rp " + n.toLocaleString("id-ID");

function renderMenu() {
  const grid = document.getElementById("menuGrid");
  const search = document.getElementById("searchInput").value.toLowerCase();
  const filtered = menuData.filter(m => 
    (currentCat === "semua" || m.cat === currentCat) &&
    m.name.toLowerCase().includes(search)
  );
  
  grid.innerHTML = filtered.map(m => `
    <div class="menu-card" onclick="addToCart(${m.id})">
      <span class="icon">️</span>
      <div>
        <div class="name">${m.name}</div>
        <div class="price">${rupiah(m.price)}</div>
      </div>
    </div>
  `).join("");
}

function addToCart(id) {
  cart[id] = (cart[id] || 0) + 1;
  renderCart();
}

function changeQty(id, delta) {
  cart[id] = (cart[id] || 0) + delta;
  if (cart[id] <= 0) delete cart[id];
  renderCart();
}

function renderCart() {
  const items = document.getElementById("cartItems");
  const empty = document.getElementById("cartEmpty");
  const ids = Object.keys(cart);
  
  let totalQty = 0;
  let subtotal = 0;
  
  if (ids.length === 0) {
    empty.style.display = "block";
    items.innerHTML = "";
  } else {
    empty.style.display = "none";
    items.innerHTML = ids.map(id => {
      const m = menuData.find(x => x.id == id);
      const qty = cart[id];
      totalQty += qty;
      subtotal += m.price * qty;
      return `
        <div class="cart-item">
          <div class="cart-item-info">
            <div class="cart-item-name">${m.name}</div>
            <div class="cart-item-price">${rupiah(m.price)} × ${qty} = ${rupiah(m.price * qty)}</div>
          </div>
          <div class="qty-ctrl">
            <button class="qty-btn del" onclick="changeQty(${id}, -1)">−</button>
            <span class="qty-val">${qty}</span>
            <button class="qty-btn" onclick="changeQty(${id}, 1)">+</button>
          </div>
        </div>
      `;
    }).join("");
  }
  
  const tax = Math.round(subtotal * 0.1);
  const total = subtotal + tax;
  
  document.getElementById("cartCount").textContent = totalQty;
  document.getElementById("subtotal").textContent = rupiah(subtotal);
  document.getElementById("tax").textContent = rupiah(tax);
  document.getElementById("total").textContent = rupiah(total);
  document.getElementById("payBtn").disabled = totalQty === 0;
}

// Event listeners
document.querySelectorAll(".cat-btn").forEach(btn => {
  btn.addEventListener("click", () => {
    document.querySelectorAll(".cat-btn").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
    currentCat = btn.dataset.cat;
    renderMenu();
  });
});

document.getElementById("searchInput").addEventListener("input", renderMenu);

document.getElementById("payBtn").addEventListener("click", () => {
  const total = document.getElementById("total").textContent;
  if (confirm(`Total pembayaran: ${total}\nProses pembayaran?`)) {
    alert("✅ Pembayaran berhasil!\nTerima kasih sudah order di Seblak Mercon 🌶️");
    cart = {};
    renderCart();
  }
});

// Init
renderMenu();
renderCart();
</script>

</body>
</html>
